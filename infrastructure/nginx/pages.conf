# Serves the static Pages artifact the way GitHub Pages does: under /aplora/,
# with directory indexes and a 404 page, no server-side routing.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 8m;

  location = / {
    return 302 /aplora/;
  }

  location /aplora/ {
    try_files $uri $uri/ $uri/index.html /aplora/404.html;
    error_page 404 /aplora/404.html;
  }

  location = /aplora/404.html {
    internal;
  }
}
