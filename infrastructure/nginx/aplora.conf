# Reverse proxy for a single host with three portals and one API.
# Replace example.com and the certificate paths before use.
#
# The portals and the API share a hostname, which keeps the session cookie
# first-party for all three portals.

upstream aplora_api { server 127.0.0.1:4000; keepalive 32; }
upstream aplora_marketplace { server 127.0.0.1:4321; keepalive 16; }
upstream aplora_developer { server 127.0.0.1:4322; keepalive 16; }
upstream aplora_admin { server 127.0.0.1:4323; keepalive 16; }

server {
  listen 80;
  server_name example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name example.com;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  client_max_body_size 210m;

  location /api/ {
    proxy_pass http://aplora_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  location /health {
    proxy_pass http://aplora_api;
    access_log off;
  }

  location /developer/ {
    proxy_pass http://aplora_developer/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /admin/ {
    proxy_pass http://aplora_admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Restrict the admin portal to your own network if possible.
    # allow 203.0.113.0/24; deny all;
  }

  location / {
    proxy_pass http://aplora_marketplace;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
